<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Click Tracker — Click Me!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#0f1724; color:#f8fafc; }
    h1 { margin-bottom: 12px; }
    button { font-size:20px; padding:14px 28px; border-radius:10px; border:none; cursor:pointer; background:#06b6d4; color:#012; }
    .counter { margin-top:16px; font-size:18px; opacity:0.9; }
  </style>

  <!-- Firebase v8 (compat version) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <h1>Click Tracker</h1>
  <button id="clickBtn">CLICK ME</button>
  <div class="counter" id="status">Not clicked yet</div>

<script>
  // --- Your Firebase config ---
  const firebaseConfig = {
    apiKey: "AIzaSyCMFbCgy6hB5TFffoOyQQMhDPAxPRx__so",
    authDomain: "bdaproject-a3634.firebaseapp.com",
    databaseURL: "https://bdaproject-a3634-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bdaproject-a3634",
    storageBucket: "bdaproject-a3634.firebasestorage.app",
    messagingSenderId: "610869985935",
    appId: "1:610869985935:web:df28d78b6fd636dd89a6fa",
    measurementId: "G-F1L4CP20GM"
  };
  // ------------------------------

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const uid = "user_" + Math.random().toString(36).slice(2, 8);

  const statusEl = document.getElementById("status");
  const btn = document.getElementById("clickBtn");

  btn.addEventListener("click", () => {
    const ts = Date.now();

    db.ref("demo_clicks").push({
      user: uid,
      timestamp: ts
    })
    .then(() => {
      statusEl.textContent = "Click recorded at " + new Date(ts).toLocaleTimeString();
    })
    .catch(err => {
      statusEl.textContent = "Error: " + err.message;
    });
  });
</script>
</body>
</html>
